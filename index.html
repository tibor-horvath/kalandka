<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Icon links and theme-color are injected by vite-plugin-pwa (pwa-assets.config.ts). -->
    <!-- Light only: stops browsers from auto-darkening the page (there is no dark theme). -->
    <meta name="color-scheme" content="only light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kalandka" />
    <meta name="description" content="Számolós és logikai játékok 5–7 éveseknek." />
    <!-- Link previews. %SITE_URL% is the public origin, filled in at build time (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kalandka" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:title" content="Kalandka" />
    <meta property="og:description" content="Számolós és logikai játékok 5–7 éveseknek." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kalandka: számolós és logikai játékok 5–7 éveseknek" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Kalandka</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
