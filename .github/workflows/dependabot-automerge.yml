# Turn on auto-merge for Dependabot's patch and minor PRs; GitHub squash-merges them once the
# required checks on main pass. Majors (including a grouped PR that contains one) stay open
# for a manual review. Needs "Allow auto-merge" in the repo settings and required status checks
# on main, or auto-merge would merge before CI has run.
# Plain pull_request, not pull_request_target: a Dependabot-triggered run may raise its own
# GITHUB_TOKEN permissions, and the job never checks out or runs the PR's code.
name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge (patch and minor only)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
