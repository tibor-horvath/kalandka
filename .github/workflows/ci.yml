# Build and test on every push to main and every PR, plus a secret scan of the new commits.
# Pushes to main then update the release PR; merging that PR cuts a release, and only a release
# (or a manual run on main) deploys the tested build to Azure Static Web Apps.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  node:
    name: Node
    uses: tibor-horvath/ci-toolkit/.github/workflows/node-build-test.yml@v1
    with:
      node-version: "22.x"
      # `npm run lint`: the React hooks rules (eslint.config.js).
      lint-script: lint
      # `npm run build` already type-checks with `tsc -b`.
      typecheck-script: ""
      # `npm test` is `vitest` (watch mode locally); run once in CI.
      test-args: --run
      # Public origin for the link-preview tags (repository variable, e.g. https://www.kalandka.hu); empty until the domain is set.
      build-env: |
        SITE_URL=${{ vars.SITE_URL }}
    permissions:
      contents: read

  secrets:
    name: Secret scan
    uses: tibor-horvath/ci-toolkit/.github/workflows/secret-scan.yml@v1
    permissions:
      contents: read

  release:
    name: Release
    # Only main is released; PRs stop after the checks above.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [node, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Queue, never cancel: stopping mid-run could leave a tag without a release.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Opens or updates the release PR; once that PR is merged, tags vX.Y.Z and cuts a GitHub release.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: Deploy to production
    # A push to main only reaches production as part of a release; a manual run redeploys main as it is.
    if: needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    needs: [node, secrets, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    concurrency:
      # One deploy at a time; a newer one waits instead of cancelling a half-finished upload.
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # The dist/ the node job built and tested, so what ships is exactly what passed.
      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build
          path: dist

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: dist
          skip_app_build: true
          skip_api_build: true
